name: Rebuild solar site

# Cloudflare Pages builds niches/solar on every push. This adds a monthly
# rebuild so year-stamped titles and copy stay current with no commits.
# Needs repo secret CF_SOLAR_DEPLOY_HOOK (Cloudflare Pages -> solarbycity
# project -> Settings -> Builds -> Deploy hooks).
on:
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CF_SOLAR_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_SOLAR_DEPLOY_HOOK not set; skipping"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling on every run keeps the monthly rebuild alive.
      - name: Keep monthly schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/solar-rebuild.yml/enable"
